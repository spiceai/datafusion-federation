[workspace]
resolver = "2"

members = ["datafusion-federation", "e2e-test", "integration-test"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/datafusion-federation"

[workspace.dependencies]
arrow-json = "59.0"
async-stream = "0.3"
async-trait = "0.1"
datafusion = "55"
datafusion-federation = { path = "./datafusion-federation", version = "0.4.2" }
futures = "0.3"
tokio = { version = "1.41", features = ["full"] }

[patch.crates-io]
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "8ee430737cb6999025d0b29672ec6cb92df19b6d" } # branch: spiceai-1.4.4-patches (DuckDB 1.4.4, arrow 59)

# arrow-rs 59 with spice patches (ObjectVersionType + new_with_meta for Azure compatibility) — branch: spiceai-59-patches
