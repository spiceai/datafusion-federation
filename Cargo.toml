[workspace]
resolver = "2"

members = ["datafusion-federation", "e2e-test", "integration-test"]

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/datafusion-contrib/datafusion-federation"

[workspace.dependencies]
arrow-json = "59.2"
async-stream = "0.3"
async-trait = "0.1"
datafusion = "55.1.0"
datafusion-federation = { path = "./datafusion-federation", version = "0.5.7" }
futures = "0.3"
tokio = { version = "1.41", features = ["full"] }

[patch.crates-io]
# datafusion-table-providers depends on crates.io datafusion-federation 0.5.7;
# point it at this workspace so the integration tests see a single federation crate.
datafusion-federation = { path = "./datafusion-federation" }

# duckdb 1.4.4 on arrow 59, the same rev datafusion-table-providers pins directly. branch: spiceai-1.4.4-patches
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "875974763e847eb4dc4e071f875f5bbecdd63b47" }

